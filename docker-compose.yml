services:
  blogsvc:
    build: .
    container_name: blogsvc
    ports:
      - "8000:8000"

    volumes:
      - .:/workdir

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15.3-alpine
    container_name: blogdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blogdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5